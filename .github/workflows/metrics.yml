# Renders terminal.svg with Ishi-eenn/profile-metrics (latest main) and commits
# it back to this repo, where the README picks it up by relative path.
name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out the generator
        uses: actions/checkout@v5
        with:
          repository: Ishi-eenn/profile-metrics
          path: generator

      - name: Generate terminal.svg
        working-directory: generator
        run: npm ci && npm start
        env:
          # METRICS_TOKEN (PAT) counts private contributions; the built-in
          # token sees public data only.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          METRICS_USER: shmorish

      - name: Commit terminal.svg
        run: |
          cp generator/terminal.svg terminal.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --cached --quiet || { git commit -m "chore: update terminal.svg"; git push; }
